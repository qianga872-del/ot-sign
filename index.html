<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>自愿加班协商书 · 电子签署系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1e5f8f; --brand-d:#14456b; --brand-l:#e8f2fa;
  --ink:#1b2733; --ink2:#5a6b7c; --line:#d8e0e8; --bg:#f4f7fa;
  --ok:#1a8a55; --warn:#c8811a; --err:#c0392b;
}
body{font-family:"Segoe UI","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:6px;padding:8px 14px;
  background:var(--brand);color:#fff;transition:.15s}
button:hover{background:var(--brand-d)}
button.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.sec:hover{background:var(--brand-l)}
button.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
button.ghost:hover{background:#eef2f6}
button.danger{background:#fff;color:var(--err);border:1px solid var(--err)}
button.danger:hover{background:#fdeceb}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,95,143,.12)}
label{font-size:12px;color:var(--ink2);font-weight:600;display:block;margin-bottom:4px}
textarea{resize:vertical;line-height:1.6}

.top{background:linear-gradient(100deg,#14456b,#1e5f8f);color:#fff;padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top h1{font-size:17px;font-weight:600;letter-spacing:.3px}
.top .sub{font-size:11px;opacity:.8}
.tabs{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.13);padding:4px;border-radius:8px}
.tabs button{background:transparent;color:#dbe8f2;padding:7px 16px;border-radius:6px;font-size:13px}
.tabs button.on{background:#fff;color:var(--brand-d);font-weight:600}

.wrap{max-width:1180px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:15px;margin-bottom:4px;color:var(--brand-d)}
.card .hint{font-size:12px;color:var(--ink2);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:9px 12px;border-radius:8px;background:#eef2f6;color:var(--ink2);
  font-size:12px;font-weight:600;border:1px solid var(--line);display:flex;align-items:center;gap:8px}
.step.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.step .n{width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:11px}
.step.on .n{background:rgba(255,255,255,.3)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
th{background:#eef3f8;font-size:12px;color:var(--brand-d);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:#fafcfd}
.tbl-wrap{overflow:auto;border-radius:8px;border:1px solid var(--line)}
td input{border:none;padding:3px 4px;background:transparent;font-size:13px}
td input:focus{background:#fff;box-shadow:none;border:1px solid var(--brand)}
.mini{font-size:11px;color:var(--ink2)}
.mono{font-family:Consolas,Menlo,monospace;font-size:12px}

.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600}
.pill.ok{background:#e3f6ec;color:var(--ok)}
.pill.no{background:#fdeceb;color:var(--err)}
.pill.wait{background:#fdf3e3;color:var(--warn)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
.empty{padding:34px;text-align:center;color:var(--ink2);font-size:13px;background:#fafbfc;
  border:1px dashed var(--line);border-radius:8px}

/* 二维码 */
.qrbox{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.qrbox .code{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.qrbox canvas{image-rendering:pixelated;border-radius:4px}
.qrbox .code .cap{font-size:11px;color:var(--ink2);margin-top:8px;max-width:230px;word-break:break-all}
.qrinfo{flex:1;min-width:260px}
.notice{background:#fff8e6;border:1px solid #f2dfae;color:#7a5a12;padding:10px 12px;border-radius:8px;font-size:12px;margin-top:10px}
.notice.info{background:var(--brand-l);border-color:#bcd9ef;color:var(--brand-d)}

/* 员工端 */
.emp{max-width:560px;margin:0 auto;padding:16px}
.emp .card{padding:18px}
.login-big input{font-size:20px;padding:14px;text-align:center;letter-spacing:3px;font-family:Consolas,monospace}
.docbox{background:#fafcfd;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;
  max-height:340px;overflow:auto;font-size:12.5px;line-height:1.75}
.docbox h3{font-size:13px;text-align:center;margin-bottom:8px;color:var(--brand-d)}
.docbox .vi{color:#1b2733}
.docbox .cn{color:#4a5b6c;font-size:12px;margin-bottom:8px}
.docbox hr{border:none;border-top:1px dashed var(--line);margin:8px 0}
.selfbox{background:var(--brand-l);border:1px solid #bcd9ef;border-radius:8px;padding:12px;margin-bottom:14px}
.selfbox .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.selfbox .row b{font-weight:600}

.pad{border:2px dashed var(--brand);border-radius:10px;background:#fff;position:relative;overflow:hidden;
  touch-action:none;cursor:crosshair}
.pad canvas{display:block;width:100%;touch-action:none}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9ab;font-size:13px;pointer-events:none}
.pad-tools{display:flex;gap:8px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fafbfc;border:1px solid var(--line);
  border-radius:8px;padding:12px;margin:14px 0;font-size:13px}
.chk input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--brand)}
.big{width:100%;padding:14px;font-size:15px;font-weight:600}
.locbox{background:#f6f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;margin-top:10px}
.locbox b{color:var(--brand-d)}

.okmark{text-align:center;padding:20px 0}
.okmark .ic{width:60px;height:60px;border-radius:50%;background:#e3f6ec;color:var(--ok);font-size:32px;
  display:grid;place-items:center;margin:0 auto 12px}

/* ============ A4 打印 ============ */
@page{size:A4 portrait;margin:11mm 11mm 12mm}
#print-root{display:none}
@media print{
  body{background:#fff}
  .top,.wrap,.no-print,#app{display:none !important}
  #print-root{display:block}
  .pg{width:186mm;min-height:272mm;position:relative;page-break-after:always}
  .pg:last-child{page-break-after:auto}
  .p-hd{text-align:center;border-bottom:2px solid #000;padding-bottom:4mm;margin-bottom:3mm}
  .p-hd .cn1{font-weight:700;font-size:11.5pt;letter-spacing:.2px}
  .p-hd .cn2{font-size:9pt;text-decoration:underline;font-weight:600;margin-top:1mm;letter-spacing:.4px}
  .p-hd .cn3{font-size:8.5pt;margin-top:1mm}
  .p-hd .dt{font-size:9pt;font-style:italic;text-align:right;margin-top:1mm}
  .p-ttl{text-align:center;margin:3mm 0 2mm}
  .p-ttl .v{font-size:12.5pt;font-weight:700}
  .p-ttl .c{font-size:11pt;font-weight:600;margin-top:.5mm}
  .p-body{font-size:9pt;line-height:1.5;margin-bottom:3mm}
  .p-body .k{font-weight:700}
  .p-body .vi{font-size:8.6pt}
  .p-body p{margin-bottom:1.6mm}
  .p-cont{font-size:8pt;font-style:italic;text-align:center;margin-bottom:2mm}
  table.pt{width:100%;border-collapse:collapse;table-layout:fixed}
  table.pt th,table.pt td{border:1px solid #333;padding:1mm;font-size:8pt;vertical-align:middle;
    text-align:center;word-break:break-word;line-height:1.25}
  table.pt th{background:#f0f0f0 !important;font-size:7.6pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pt td.nm{text-align:left;font-size:7.4pt}
  .sg{display:block;margin:0 auto;max-width:38mm;height:7mm;object-fit:contain}
  .sg-empty{height:7mm}
  .tm{font-size:6.4pt;line-height:1.2;margin-top:.6mm;color:#222}
  .tm.dec{color:#000;font-weight:700}
  .tm .code{font-family:Consolas,monospace;font-size:6pt}
  .ft{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
    font-size:7.5pt;color:#555;border-top:1px solid #ccc;padding-top:1mm}
  .sign-row{display:flex;gap:12mm;margin-top:6mm;font-size:8.5pt}
  .sign-row div{flex:1;text-align:center}
  .sign-row .ln{height:14mm}
}

/* 意向选择（愿意 / 不愿意） */
.choice{display:grid;gap:10px;margin:6px 0 4px}
.opt{border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;background:#fff}
.opt:hover{border-color:#9dc2df}
.opt.on{border-color:var(--brand);background:var(--brand-l)}
.opt.on.dec{border-color:var(--err);background:#fdeceb}
.opt label{display:flex;gap:10px;align-items:flex-start;margin:0;cursor:pointer}
.opt input[type=radio]{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--brand)}
.opt b{font-size:14px;display:block;color:var(--ink)}
.opt .mini{display:block;font-weight:400;margin-top:3px;font-size:12px;line-height:1.5}
#signArea{display:none}
.p-sum{font-size:8.5pt;border:1px solid #333;background:#f0f0f0 !important;padding:1.2mm;
  margin-bottom:2mm;text-align:center;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.big-sel{width:100%;padding:12px 14px;font-size:15px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.big-sel:focus{border-color:var(--brand);outline:none}

.cols-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.colmap{flex:1 1 130px;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.cm-h{font-size:11px;color:#5a6b7c;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.colmap select{width:100%;padding:7px 8px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff}
.mini-tb td,.mini-tb th{font-size:12px;padding:5px 7px}

.modal-mask{position:fixed;inset:0;background:rgba(9,26,45,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(9,26,45,.3);max-height:80vh;overflow:auto}
.modal-box h3{margin:0 0 10px;font-size:16px;color:#0b2545}
.modal-body p{margin:0 0 10px;line-height:1.7}
.modal-box .notice,.modal-box .notice.info{margin-top:8px}

</style>
</head>
<body>
<div id="app"></div>
<div id="print-root"></div>
<script>
(function () {
  var EXP = new Array(512), LOG = new Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (var i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function gmul(a, b) { if (a === 0 || b === 0) return 0; return EXP[LOG[a] + LOG[b]]; }
  var RS = [
    [1,26,19],[1,26,16],[1,26,13],[1,26,9],
    [1,44,34],[1,44,28],[1,44,22],[1,44,16],
    [1,70,55],[1,70,44],[2,35,17],[2,35,13],
    [1,100,80],[2,50,32],[2,50,24],[4,25,9],
    [1,134,108],[2,67,43],[2,33,15,2,34,16],[2,33,11,2,34,12],
    [2,86,68],[4,43,27],[4,43,19],[4,43,15],
    [2,98,78],[4,49,31],[2,32,14,4,33,15],[4,39,13,1,40,14],
    [2,121,97],[2,60,38,2,61,39],[4,40,18,2,41,19],[4,40,14,2,41,15],
    [2,146,116],[3,58,36,2,59,37],[4,36,16,4,37,17],[4,36,12,4,37,13],
    [2,86,68,2,87,69],[4,69,43,1,70,44],[6,43,19,2,44,20],[6,43,15,2,44,16]
  ];
  var EC_ORDER = ['L','M','Q','H'], EC_BITS = { L: 1, M: 0, Q: 3, H: 2 };
  var ALIGN = [null,[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  function genPoly(n) {
    var g = [1];
    for (var i = 0; i < n; i++) {
      var ng = new Array(g.length + 1);
      for (var k = 0; k < ng.length; k++) ng[k] = 0;
      for (var j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= gmul(g[j], EXP[i]); }
      g = ng;
    }
    return g;
  }
  function rsEncode(data, ecCount) {
    var gen = genPoly(ecCount);
    var res = data.concat(new Array(ecCount).fill(0));
    for (var i = 0; i < data.length; i++) {
      var coef = res[i];
      if (coef !== 0) for (var j = 0; j < gen.length; j++) res[i + j] ^= gmul(gen[j], coef);
    }
    return res.slice(data.length);
  }
  function utf8Bytes(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c < 0xdc00 && i + 1 < str.length) {
        var c2 = str.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }
  function bitLength(n) { var l = 0; while (n !== 0) { l++; n >>>= 1; } return l; }
  function bchFormat(data) {
    var d = data << 10;
    while (bitLength(d) - 11 >= 0) d ^= 0x537 << (bitLength(d) - 11);
    return ((data << 10) | d) ^ 0x5412;
  }
  function bchVersion(v) {
    var d = v << 12;
    while (bitLength(d) - 13 >= 0) d ^= 0x1f25 << (bitLength(d) - 13);
    return (v << 12) | d;
  }
  function chooseVersion(len, ecIdx) {
    for (var v = 1; v <= 10; v++) {
      var b = RS[(v - 1) * 4 + ecIdx], total = 0;
      for (var i = 0; i < b.length; i += 3) total += b[i] * b[i + 2];
      if (total * 8 >= len * 8 + 8 + (v < 10 ? 8 : 16)) return v;
    }
    return -1;
  }
  function makeMatrix(text, ecLevel) {
    var ecIdx = EC_ORDER.indexOf(ecLevel || 'M'); if (ecIdx < 0) ecIdx = 1;
    var bytes = utf8Bytes(text);
    var version = chooseVersion(bytes.length, ecIdx);
    if (version < 0) throw new Error('内容过长');
    var size = version * 4 + 17, m = [], i, j;
    for (i = 0; i < size; i++) { m.push(new Array(size)); for (j = 0; j < size; j++) m[i][j] = null; }
    function finder(r, c) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        if (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) m[rr][cc] = true;
        else if (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) m[rr][cc] = true;
        else if (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4) m[rr][cc] = true;
        else m[rr][cc] = false;
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    var pos = ALIGN[version - 1];
    if (pos) for (i = 0; i < pos.length; i++) for (j = 0; j < pos.length; j++) {
      var r0 = pos[i], c0 = pos[j];
      if ((r0 === 6 && c0 === 6) || (r0 === 6 && c0 === size - 7) || (r0 === size - 7 && c0 === 6)) continue;
      for (var dr2 = -2; dr2 <= 2; dr2++) for (var dc2 = -2; dc2 <= 2; dc2++)
        m[r0 + dr2][c0 + dc2] = (Math.abs(dr2) === 2 || Math.abs(dc2) === 2 || (dr2 === 0 && dc2 === 0));
    }
    for (i = 8; i < size - 8; i++) {
      if (m[6][i] === null) m[6][i] = i % 2 === 0;
      if (m[i][6] === null) m[i][6] = i % 2 === 0;
    }
    m[size - 8][8] = true;
    for (i = 0; i < 9; i++) { if (m[8][i] === null) m[8][i] = false; if (m[i][8] === null) m[i][8] = false; }
    for (i = 0; i < 8; i++) { if (m[8][size - 1 - i] === null) m[8][size - 1 - i] = false; if (m[size - 1 - i][8] === null) m[size - 1 - i][8] = false; }
    if (version >= 7) for (i = 0; i < 6; i++) for (j = 0; j < 3; j++) { m[size - 11 + j][i] = false; m[i][size - 11 + j] = false; }

    var bits = [];
    function push(val, len) { for (var k = len - 1; k >= 0; k--) bits.push((val >>> k) & 1); }
    push(4, 4); push(bytes.length, version < 10 ? 8 : 16);
    for (i = 0; i < bytes.length; i++) push(bytes[i], 8);
    var capBits = 0, blocks = RS[(version - 1) * 4 + ecIdx];
    for (i = 0; i < blocks.length; i += 3) capBits += blocks[i] * blocks[i + 2] * 8;
    for (i = 0; i < 4 && bits.length < capBits; i++) bits.push(0);
    while (bits.length % 8 !== 0) bits.push(0);
    var dataBytes = [];
    for (i = 0; i < bits.length; i += 8) { var b = 0; for (j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; dataBytes.push(b); }
    var padI = 0;
    while (dataBytes.length < capBits / 8) { dataBytes.push(padI++ % 2 === 0 ? 0xEC : 0x11); }

    var dBlocks = [], eBlocks = [], off = 0;
    for (i = 0; i < blocks.length; i += 3) {
      var cnt = blocks[i], total = blocks[i + 1], dcnt = blocks[i + 2];
      for (j = 0; j < cnt; j++) {
        var chunk = dataBytes.slice(off, off + dcnt); off += dcnt;
        dBlocks.push(chunk); eBlocks.push(rsEncode(chunk, total - dcnt));
      }
    }
    var final = [];
    var maxD = Math.max.apply(null, dBlocks.map(function (x) { return x.length; }));
    for (i = 0; i < maxD; i++) for (j = 0; j < dBlocks.length; j++) if (i < dBlocks[j].length) final.push(dBlocks[j][i]);
    var maxE = Math.max.apply(null, eBlocks.map(function (x) { return x.length; }));
    for (i = 0; i < maxE; i++) for (j = 0; j < eBlocks.length; j++) if (i < eBlocks[j].length) final.push(eBlocks[j][i]);

    var masks = [
      function (r, c) { return (r + c) % 2 === 0; },
      function (r) { return r % 2 === 0; },
      function (r, c) { return c % 3 === 0; },
      function (r, c) { return (r + c) % 3 === 0; },
      function (r, c) { return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; },
      function (r, c) { return (r * c) % 2 + (r * c) % 3 === 0; },
      function (r, c) { return ((r * c) % 2 + (r * c) % 3) % 2 === 0; },
      function (r, c) { return ((r + c) % 2 + (r * c) % 3) % 2 === 0; }
    ];
    function place(maskId) {
      var mm = m.map(function (row) { return row.slice(); });
      var f = masks[maskId], inc = -1, row = size - 1, bitIndex = 7, byteIndex = 0;
      for (var col = size - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        while (true) {
          for (var c2 = 0; c2 < 2; c2++) {
            if (mm[row][col - c2] === null) {
              var dark = false;
              if (byteIndex < final.length) dark = ((final[byteIndex] >>> bitIndex) & 1) === 1;
              if (f(row, col - c2)) dark = !dark;
              mm[row][col - c2] = dark;
              bitIndex--;
              if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || size <= row) { row -= inc; inc = -inc; break; }
        }
      }
      var fmt = bchFormat((EC_BITS[EC_ORDER[ecIdx]] << 3) | maskId);
      for (var k = 0; k < 15; k++) {
        var bit = ((fmt >> k) & 1) === 1;
        var vr = k < 6 ? k : (k < 8 ? k + 1 : size - 15 + k);
        mm[vr][8] = bit;
        var hc = k < 8 ? size - 1 - k : (k === 8 ? 7 : 15 - k - 1);
        mm[8][hc] = bit;
      }
      return mm;
    }
    function penalty(mm) {
      var p = 0, r, c, run;
      for (r = 0; r < size; r++) { run = 1; for (c = 1; c < size; c++) { if (mm[r][c] === mm[r][c - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (c = 0; c < size; c++) { run = 1; for (r = 1; r < size; r++) { if (mm[r][c] === mm[r - 1][c]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) {
        var v0 = mm[r][c];
        if (v0 === mm[r][c + 1] && v0 === mm[r + 1][c] && v0 === mm[r + 1][c + 1]) p += 3;
      }
      var dark = 0;
      for (r = 0; r < size; r++) for (c = 0; c < size; c++) if (mm[r][c]) dark++;
      p += 10 * Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5);
      return p;
    }
    var best = null, bestP = Infinity;
    for (i = 0; i < 8; i++) { var cand = place(i), cp = penalty(cand); if (cp < bestP) { bestP = cp; best = cand; } }
    if (version >= 7) {
      var vi = bchVersion(version);
      for (i = 0; i < 18; i++) {
        var b2 = ((vi >> i) & 1) === 1;
        var r3 = Math.floor(i / 3), c3 = i % 3;
        best[r3][size - 11 + c3] = b2; best[size - 11 + c3][r3] = b2;
      }
    }
    return best;
  }
  window.QRGEN = { make: makeMatrix };

/* 探测后端：地址栏 ?api= 优先，其次同源 /api */
function apiDetect(cb) {
  var cands = [];
  var q = new URLSearchParams(location.search);
  var forced = q.get('api');
  if (forced) cands.push(forced.replace(/\/+$/, ''));
  // 已保存的云后端地址（GitHub Pages 托管时，前端与后端不同域，必须显式指定）
  try {

  if (location.protocol === 'http:' || location.protocol === 'https:') {
    cands.push(location.origin + '/api');
  }
  var i = 0;
  (function next() {
    if (i >= cands.length) { API.on = false; API.mode = 'local'; cb(false); return; }
    var base = cands[i++];
    fetch(base + '/ping', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) {
          API.base = base; API.on = true; API.mode = 'server';

function calcStats(list) {
  var total = list.length, ag = 0, dec = 0, no = 0;
  var byDept = {}, byPlace = {};
  function bucket(m, k, e) {
    if (!m[k]) m[k] = { dept: k, total: 0, agree: 0, decline: 0, none: 0 };
    var b = m[k]; b.total++;
    var c = choiceOf(e.sign);
    if (c === null || c === '') b.none++;
    else if (c === 'decline') b.decline++;
    else b.agree++;
  }
  list.forEach(function (e) {
    var c = choiceOf(e.sign);
    if (c === null || c === '') no++;
    else if (c === 'decline') dec++;
    else ag++;
    bucket(byDept, ((e.dept || '').trim() || '未填部门'), e);
    bucket(byPlace, pickWorkPlace(e) || '未选择', e);
  });
  function fin(m) {
    var out = Object.keys(m).map(function (k) { return m[k]; });
    out.sort(function (a, b) { return b.total - a.total; });
    out.forEach(function (b) { b.rate = b.total ? Math.round(b.agree * 100 / b.total) : 0; });
    return out;
  }
  return { total: total, agree: ag, decline: dec, none: no,
    rate: total ? Math.round(ag * 100 / total) : 0, byDept: fin(byDept), byPlace: fin(byPlace) };
}

  document.getElementById('dp').onclick = function () { doPrint(d, dept); };
  document.getElementById('dc').onclick = function () {
    var lines = ['\ufeffSTT,工号,姓名(越),姓名(中),部门,班组,意向,签名时间,签名地点,防伪码'];
    list.forEach(function (e, i) {
      var s = e.sign || {}, c = choiceOf(s);
      lines.push([i + 1, e.empNo, e.nameVi, e.nameCn, e.dept, e.shift,
        c === 'decline' ? '不同意加班' : c === 'agree' ? '自愿加班' : '未响应',
        s.time || '', pickWorkPlace(e), s.hash || ''].map(csvq).join(','));
    });
    download('车间进度_' + dept + '_' + (d.docNo || d.id) + '.csv', lines.join('\n'));
  };
}
function csvq(x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }

/* ================= HR 端 ================= */
function renderHR() {
  var b = document.getElementById('body');
  if (S.view === 'list') return renderList();
  var d = getDoc(S.docId);
  if (!d) { S.view = 'list'; return renderList(); }
  var steps = [['edit', '1 填写协商内容'], ['emp', '2 导入员工名单'], ['pub', '3 发布二维码'], ['board', '4 进度与打印']];
  var html = '<div class="steps">';
  steps.forEach(function (s) {
    html += '<div class="step' + (S.view === s[0] ? ' on' : '') + '" data-g="' + s[0] + '"><span class="n">' + s[1][0] + '</span>' + s[1].slice(2) + '</div>';
  });
  html += '</div><div id="pane"></div>';
  b.innerHTML = html;
  Array.prototype.forEach.call(b.querySelectorAll('.step'), function (el) {
    el.onclick = function () { S.view = el.getAttribute('data-g'); renderHR(); };
  });
  var pane = document.getElementById('pane');
  if (S.view === 'edit') pane.innerHTML = viewEdit(d), bindEdit(d);
  else if (S.view === 'emp') pane.innerHTML = viewEmp(d), bindEmp(d);
  else if (S.view === 'pub') pane.innerHTML = viewPub(d), bindPub(d);
  else pane.innerHTML = viewBoard(d), bindBoard(d);
}

function renderList() {
  var b = document.getElementById('body');
  var h = '<div class="card"><h2>协商书列表</h2><p class="hint">每张单据 = 一份可独立发布、独立打印的自愿加班协商书</p>' +
    '<div class="bar"><button id="new">+ 新建协商书</button>' +
    '<button class="sec" id="demo">载入范本示例（德利 9/1-9/2 国庆加班）</button>' +
    '<span class="sp"></span></div>';
  if (!DB.docs.length) {
    h += '<div class="empty" style="margin-top:14px">还没有单据。点「新建协商书」或先「载入范本示例」快速体验。</div>';
  } else {
    h += '<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>单据编号</th><th>文档 ID</th><th>文书日期</th><th>员工</th><th>已签</th><th>创建时间</th><th style="width:210px">操作</th></tr></thead><tbody>';
    DB.docs.forEach(function (d) {
      var sg = 0, sdec = 0;
      d.employees.forEach(function (e) {
        if (!e.sign) return;
        if (choiceOf(e.sign) === 'decline') sdec++; else sg++;
      });
      h += '<tr><td><b>' + esc(d.docNo) + '</b></td><td class="mono">' + esc(d.id) + '</td><td>' + esc(d.dd + '/' + d.dm + '/' + d.dy) +
        '</td><td>' + d.employees.length + '</td><td><span class="pill ' + (sg === d.employees.length ? 'ok' : 'wait') + '">同意 ' + sg + '</span>' +
        (sdec ? ' <span class="pill no">不同意 ' + sdec + '</span>' : '') +
        ' <span class="mini">/ ' + d.employees.length + '</span></td>' +
        '<td class="mini">' + esc(nowStr(new Date(d.createdAt))) + '</td><td>' +
        '<button class="sec" data-open="' + d.id + '">打开</button> ' +
        '<button class="ghost" data-print="' + d.id + '">打印</button> ' +
        '<button class="danger" data-del="' + d.id + '">删除</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  b.innerHTML = h;
  document.getElementById('new').onclick = function () {
    var d = blankDoc(); DB.docs.unshift(d); save(); S.docId = d.id; S.view = 'edit'; renderHR();
  };
  document.getElementById('demo').onclick = function () {
    var d = demoDoc(); DB.docs.unshift(d); save(); S.docId = d.id; S.view = 'edit'; renderHR();
  };
  Array.prototype.forEach.call(b.querySelectorAll('[data-open]'), function (el) {
    el.onclick = function () { S.docId = el.getAttribute('data-open'); S.view = 'emp'; renderHR(); };
  });
  Array.prototype.forEach.call(b.querySelectorAll('[data-print]'), function (el) {
    el.onclick = function () { var d = getDoc(el.getAttribute('data-print')); if (d) doPrint(d); };
  });
  Array.prototype.forEach.call(b.querySelectorAll('[data-del]'), function (el) {
    el.onclick = function () {
      var id = el.getAttribute('data-del');
      askBox('删除协商书', '<p>将删除该协商书，所有签名记录一并删除，<b>不可恢复</b>。</p>', '确定删除', true, function (ok) {
        if (!ok) return;
        DB.docs = DB.docs.filter(function (x) { return x.id !== id; });
        save(); renderList();
      });
    };
  });
}

function blankDoc() {
  var t = new Date();
  var d = demoDoc();
  d.id = uid(); d.docNo = ''; d.shifts = [d.shifts[0]]; d.employees = [];
  d.dy = String(t.getFullYear()); d.dm = String(t.getMonth() + 1).padStart(2, '0'); d.dd = String(t.getDate()).padStart(2, '0');
  return d;
}

/* 页内确认框：cb(true)=确定 cb(false)=取消 */
function askBox(title, body, okText, danger, cb) {
  closeModal();
  MODAL_CB = cb;
  var wrap = document.createElement('div');
  wrap.id = 'modal';
  wrap.className = 'modal-mask';
  wrap.innerHTML = '<div class="modal-box"><h3>' + esc(title) + '</h3>' +
    '<div class="modal-body">' + body + '</div>' +

    '<button class="ghost" id="mbNo">取消</button>' +
    '<button id="mbYes" class="' + (danger ? 'danger' : '') + '" style="min-width:110px">' + esc(okText) + '</button></div></div>';
  document.body.appendChild(wrap);
  document.getElementById('mbYes').onclick = function () { var f = MODAL_CB; closeModal(); if (f) f(true); };
  document.getElementById('mbNo').onclick = function () { var f = MODAL_CB; closeModal(); if (f) f(false); };
  wrap.onclick = function (e) { if (e.target === wrap) { var f = MODAL_CB; closeModal(); if (f) f(false); } };
  var y = document.getElementById('mbYes'); if (y) y.focus();
}

}

    '<div class="cols-wrap">' + cols + '</div>' + warn +
    (sample ? '<div class="tbl-wrap" style="margin-top:10px"><table class="mini-tb"><thead><tr>' +
      p.sample[0].map(function (_, i) { return '<th>' + (i + 1) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      sample + '</tbody></table></div>' : '') +
    (p.list.length ? '<div class="notice info" style="margin-top:8px">解析结果对照（前 3 人）：<br>' +
      p.list.slice(0, 3).map(function (r) {
        return '<span class="mono">' + esc(r.empNo) + '</span> · 越文名 <b>' + esc(r.nameVi || '（空）') +

    '<button class="ghost" id="cancelPrev">取消</button><span class="sp"></span></div></div>';

function roleOptions(cur) {

  };

  /* ---- 解析 → 预览 ---- */

  function doParse(txt) {
    if (!txt || !txt.trim()) { msg('请先粘贴内容或选择文件', true); return; }

      var r = new FileReader();
      r.onload = function () { S.paste = String(r.result); doParse(S.paste); };
      r.readAsText(f, 'UTF-8');
    } else {
      msg('正在加载 XLSX 解析组件…', false);
      loadXLSX(function (err) {
        if (err) { msg('XLSX 解析组件加载失败（可能无外网）。请把 Excel 另存为 CSV 后再上传，或改用「粘贴」。', true); return; }
        var r2 = new FileReader();

          try {

  };
  /* ---- 预览区交互 ---- */
  Array.prototype.forEach.call(p.querySelectorAll('[data-col]'), function (el) {
    el.addEventListener('change', function () {
      var map = readColMap(p);

function readColMap(p) {

function applyList(d, list) {

function drawQR(cv, text) {
  var m;
  try { m = QRGEN.make(text, 'M'); } catch (e) { m = null; }
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!m) { ctx.fillStyle = '#c0392b'; ctx.fillText('地址过长', 10, 30); return; }
  var n = m.length, q = 4, cell = cv.width / (n + q * 2);
  ctx.fillStyle = '#0b2545';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (m[r][c]) ctx.fillRect((c + q) * cell, (r + q) * cell, cell + .5, cell + .5);
  // 中心 logo 留白
  ctx.fillStyle = '#fff';
  var s = cell * 6, o = (cv.width - s) / 2;
  ctx.fillRect(o, o, s, s);
  ctx.strokeStyle = '#0b2545'; ctx.lineWidth = 2; ctx.strokeRect(o, o, s, s);
  ctx.fillStyle = '#0b2545'; ctx.font = 'bold ' + Math.round(s * .52) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✍', cv.width / 2, cv.height / 2 + 1);
}

  var imgs = root.querySelectorAll('img');
  var left = imgs.length, done = false;
  function go() { if (done) return; done = true; window.print(); }
  setTimeout(go, 1800);            // 兜底：图片事件万一不触发也不会卡住
  if (!left) { setTimeout(go, 60); return; }
  Array.prototype.forEach.call(imgs, function (im) {
    if (im.complete) { if (--left === 0) setTimeout(go, 60); }
    else { im.onload = im.onerror = function () { if (--left === 0) setTimeout(go, 60); }; }
  });
}
function buildPages(d) {
  /* A4 纵向：版心高约 274mm。行高按「签名图 7mm + 自愿标记 + 单元格内边距」实测取 13mm，
     宁可每页少放几行，也不能溢出到下一页。 */
  var ROW = 13;
  var rep = !!d.showRepSign;
  var bodyMm = 18 + d.shifts.length * 15 + 10;   // 正文（放假/原因/各时间段/地点）
  var firstRows = Math.max(4, Math.floor((272 - 26 - 13 - bodyMm - 10) / ROW));
  var restRows = Math.max(6, Math.floor((272 - 14 - 10 - 10) / ROW));
  // 末页要留公司/工会代表签字栏，容量少 2 行
  var capOf = function (P) {
    if (P <= 1) return firstRows - (rep ? 2 : 0);
    return firstRows + (P - 2) * restRows + (restRows - (rep ? 2 : 0));
  };
  var n = d.employees.length, P = 1;
  var ag = 0, dec = 0, no = 0;
  d.employees.forEach(function (e) {
    if (!e.sign) no++;
    else if (choiceOf(e.sign) === 'decline') dec++;
    else ag++;
  });
  while (capOf(P) < n && P < 200) P++;
  var chunks = [], i = 0;
  for (var pi = 0; pi < P; pi++) {
    var c = (pi === 0) ? firstRows : (pi === P - 1 ? restRows - (rep ? 2 : 0) : restRows);
    chunks.push(d.employees.slice(i, i + c)); i += c;
  }
  var total = chunks.length, html = '';
  chunks.forEach(function (part, pi) {
    var isFirst = pi === 0;
    html += '<div class="pg">';
    html += '<div class="p-hd"><div class="cn1">' + esc(d.companyVi).toUpperCase() + '</div>' +
      '<div class="cn2">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>Độc lập - Tự do - Hạnh phúc</div>' +
      '<div class="cn3">---------------</div>' +
      '<div class="dt">Ngày ' + esc(d.dd) + ' tháng ' + esc(d.dm) + ' năm ' + esc(d.dy) + '</div></div>';
    if (isFirst) {
      html += '<div class="p-ttl"><div class="v">VĂN BẢN THỎA THUẬN TỰ NGUYỆN LÀM THÊM GIỜ</div>' +
        '<div class="c">员 工 自 愿 加 班 协 商 书</div></div>';
      html += '<div class="p-body">';
      html += '<p><span class="k">Thời gian nghỉ lễ / 放假时间：</span><br><span class="vi">' + esc(d.holidayVi) + '</span><br>' + esc(d.holidayCn) + '</p>';
      html += '<p><span class="k">Lý do làm thêm / 加班原因及加班费：</span><br><span class="vi">' + esc(d.reasonVi) + '</span><br>' + esc(d.reasonCn) + '</p>';
      html += '<p><span class="k">Thời gian làm thêm / 加班时间及加班费：</span></p>';
      d.shifts.forEach(function (s, si) {
        html += '<p style="margin-left:4mm">' + (si + 1) + '. <span class="vi">' + esc(s.vi) + '</span><br>' + esc(s.cn) + '</p>';
      });
      if (d.workPlaces && d.workPlaces.length) {
        html += '<p><span class="k">Địa điểm làm thêm / 加班地点：</span>' +
          '由每位员工在签字时自行选择（' + esc(d.workPlaces.join('；')) + '）</p>';
      }
      html += '</div>';
      html += '<div class="p-sum">Đồng ý 同意加班 ' + ag + ' 人 &nbsp;·&nbsp; Không đồng ý 不同意加班 ' + dec +
        ' 人 &nbsp;·&nbsp; Chưa phản hồi 未响应 ' + no + ' 人 &nbsp;·&nbsp; Tổng 共 ' + d.employees.length + ' 人</div>';
    } else {
      html += '<div class="p-cont">（续表 / Tiếp theo）VĂN BẢN THỎA THUẬN TỰ NGUYỆN LÀM THÊM GIỜ — 员工自愿加班协商书</div>';
    }
    html += '<table class="pt"><colgroup><col style="width:5%"><col style="width:10%"><col style="width:16%">' +
      '<col style="width:10%"><col style="width:4%"><col style="width:13%"><col style="width:20%"><col style="width:22%"></colgroup>';
    html += '<thead><tr><th>STT<br>序号</th><th>Số thẻ<br>工号</th><th>Họ tên<br>姓名</th><th>Bộ phận<br>部门</th>' +
      '<th>Ca<br>班组</th><th>Địa điểm làm thêm<br>工作地点</th><th>Công nhân ký tên<br>员工签名</th><th>Thời gian ký<br>签名时间</th></tr></thead><tbody>';
    part.forEach(function (e, k) {
      var idx = chunks.slice(0, pi).reduce(function (a, c) { return a + c.length; }, 0) + k + 1;
      var s = e.sign;
      html += '<tr>' +
        '<td>' + idx + '</td>' +
        '<td>' + esc(e.empNo) + '</td>' +
        '<td class="nm">' + esc(e.nameVi) + (e.nameCn ? '<br>' + esc(e.nameCn) : '') + '</td>' +
        '<td>' + esc(e.dept) + '</td>' +
        '<td>' + esc(e.shift) + '</td>' +
        '<td class="tm">' + esc(pickWorkPlace(e)) + '</td>' +
        '<td>' + (s ? '<img class="sg" src="' + s.img + '"><div class="tm' + (choiceOf(s) === 'decline' ? ' dec' : '') + '">' +
          (choiceOf(s) === 'decline' ? '✗ Không đồng ý / 不同意' : '✓ Tự nguyện / 自愿') + '</div>' : '<div class="sg-empty"></div>') + '</td>' +
        '<td>' + (s ? '<div class="tm">' + esc(s.time) + '<div class="code">' + esc(s.hash) + '</div></div>' : '') + '</td></tr>';
    });
    html += '</tbody></table>';
    if (d.showRepSign && pi === total - 1) {
      html += '<div class="sign-row"><div><div class="ln"></div>Đại diện Công ty<br>公司代表</div>' +
        '<div><div class="ln"></div>Đại diện Công đoàn<br>工会代表</div>' +
        '<div><div class="ln"></div>Ngày / 日期<br>&nbsp;</div></div>';
    }
    html += '<div class="ft"><span>' + esc(d.companyCn) + ' · ' + esc(d.docNo || d.id) + ' · ID ' + esc(d.id) + '</span>' +
      '<span>Trang ' + (pi + 1) + ' / ' + total + ' · 第 ' + (pi + 1) + ' 页 / 共 ' + total + ' 页</span></div>';
    html += '</div>';
  });
  return html;
}

function empLogin() {
  var d = EMP.doc;
  var sg = d.employees.filter(function (e) { return e.sign; }).length;
  var cntTxt = d.employees.length ? ' · 已签 ' + sg + ' / ' + d.employees.length + ' 人' : '';
  var dateTxt = (d.dd && d.dm && d.dy) ? ' · 文书日期 ' + esc(d.dd + '/' + d.dm + '/' + d.dy) : '';
  document.getElementById('empbody').innerHTML =
    '<div class="card"><h2>' + esc(d.docNo || '协商书') + '</h2>' +
    '<p class="hint">单据编号 ' + esc(d.id) + dateTxt + cntTxt + '</p>' +
    '<div class="login-big"><label style="text-align:center">请输入工号 / Nhập số thẻ</label>' +
    '<input id="empno" placeholder="例如 14027464" inputmode="numeric" autocomplete="off"></div>' +
    '<button class="big" id="go" style="margin-top:12px">下一步：查看协议</button>' +
    '<div id="em" style="margin-top:10px"></div></div>';
  var inp = document.getElementById('empno');
  document.getElementById('go').onclick = tryLogin;
  inp.onkeydown = function (e) { if (e.key === 'Enter') tryLogin(); };
  inp.focus();
  function tryLogin() {
    var v = inp.value.trim();
    if (!v) { em('请输入工号', true); return; }
    var go = function (me) {
      EMP.me = me;
      if (me.sign) empDone(); else empSign();
    };
    if (API.on) {
      em('正在核对…', false);
      apiGet('/session/' + encodeURIComponent(d.id) + '?empno=' + encodeURIComponent(v))
        .then(function (j) {
          if (!j.ok) { em('工号 ' + esc(v) + ' 不在本次名单中，请核对或联系 HR。', true); return; }
          EMP.meta = j.doc;
          go(j.me);
        }).catch(function (e) { em('网络异常，请检查手机信号后重试（' + esc(e.message) + '）', true); });
      return;
    }
    var me = null;
    for (var i = 0; i < d.employees.length; i++) if (String(d.employees[i].empNo).trim() === v) { me = d.employees[i]; break; }
    if (!me) { em('工号 ' + esc(v) + ' 不在本次名单中，请核对或联系 HR。', true); return; }
    go(me);
  }
  function em(t, bad) {
    document.getElementById('em').innerHTML = '<div class="notice' + (bad ? '' : ' info') + '">' + t + '</div>';
  }
}
function pickWorkPlace(e) {

    '<label style="margin-top:4px">请选择您的意向 / Chọn ý kiến của bạn</label>' +
    '<div class="choice">' +
    '<div class="opt" id="opt-agree"><label><input type="radio" name="ch" value="agree">' +

    '</div>' +
    '<div id="signArea">' +
    '<label style="margin-top:12px">手写签名 / Ký tên（请用手指在框内书写）</label>' +
    '<div class="pad" id="pad"><canvas id="cv"></canvas><div class="ph" id="ph">在此手写签名</div></div>' +
    '<div class="pad-tools"><button class="ghost" id="clr">清除重写</button><span class="sp"></span></div>' +
    '<label class="chk"><input type="checkbox" id="vol"><span id="declText"></span></label>' +
    wpSelectHtml(d) +
    '<div class="locbox" id="loc"><b>存证信息</b><br>提交时系统将记录：<span id="l1">签名时间（精确到分）</span> · ' +

    '</div>' +
    '<div id="w" style="margin-top:10px"></div>' +
    '<button class="big" id="sub" style="margin-top:14px" disabled>请先选择上方意向</button></div>';
  var pad = initPad(document.getElementById('cv'), document.getElementById('ph'));
  var CHOICE = null;
  var DECL = {
    agree: 'Tôi xác nhận đã đọc kỹ nội dung trên và <b>tự nguyện</b> làm thêm giờ.<br>' +
      '本人确认已仔细阅读以上内容，系<b>自愿</b>参加本次加班，知晓加班时间与加班费计算方式。',

    var img = pad.data();

    // 关键：不等待定位。先用员工选择的地点完成提交，GPS 拿不到也不影响。
    // 之后若定位成功，后台把坐标补进这条记录（防伪码不变）。
    if (!finish(null, '', true)) { sub.disabled = false; sub.textContent = sub.dataset.txt || '提交签名'; return; }
    attachGpsLater(me, d);
  };
  function warn(t, bad, clear) {
    var el = document.getElementById('w');
    if (clear && !t) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="notice' + (bad ? '' : ' info') + '">' + t + '</div>';
  }
}
/* 提交后后台补 GPS：拿到就更新记录，拿不到就算了，绝不阻塞 */
function attachGpsLater(me, d) {
  if (!navigator.geolocation) return;
  var done = false;
  var timer = setTimeout(function () { done = true; }, 8000);
  try {
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (done) return; done = true; clearTimeout(timer);
      var la = pos.coords.latitude, ln = pos.coords.longitude;
      if (!me.sign) return;
      me.sign.gps = true;
      me.sign.lat = la; me.sign.lng = ln; me.sign.acc = pos.coords.accuracy;

}

function choiceOf(s) {
  if (!s) return '';
  if (s.choice) return s.choice;
  return s.voluntary === false ? 'decline' : 'agree';   // 兼容旧数据
}
/* 签名板 */
function initPad(cv, ph) {
  var dpr = window.devicePixelRatio || 1;
  var H = 170;
  function size() {
    var w = cv.parentNode.clientWidth;
    cv.width = w * dpr; cv.height = H * dpr;
    cv.style.height = H + 'px';
  }
  size();
  var ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b2545';
  var drawing = false, last = null, empty = true;
  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function start(e) {
    e.preventDefault(); drawing = true; last = pos(e); empty = false;
    if (ph) ph.style.display = 'none';
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!drawing) return; e.preventDefault();
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end() { drawing = false; }
  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', end);
  window.addEventListener('resize', function () { size(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b2545'; });
  return {
    clear: function () { ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr); empty = true; if (ph) ph.style.display = ''; },
    data: function () { if (empty) return null; return trim(cv); }
  };
}
function trim(cv) {
  var w = cv.width, h = cv.height;
  var d = cv.getContext('2d').getImageData(0, 0, w, h).data;
  var x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  var p = 8 * (window.devicePixelRatio || 1);
  x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w - 1, x1 + p); y1 = Math.min(h - 1, y1 + p);
  var c2 = document.createElement('canvas');
  c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
  c2.getContext('2d').drawImage(cv, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
  return c2.toDataURL('image/png');
}
/* 定位：只做附加存证，绝不阻塞提交。
   浏览器定位可能长时间不回调（权限弹窗被忽略 / 非 HTTPS 静默失败），
   因此设 6 秒超时，超时就放弃 GPS，只保留员工选择的地点。 */
function grabLocation(cb, onManual) {
  var place = '';
  var settled = false;
  onManual = onManual || function (v) { cb(null, v, true); };
  function bail(why) { if (settled) return; settled = true; cb(null, '', true, why); }
  var timer = setTimeout(function () { bail('timeout'); }, 6000);
  var wrap = function (loc, p, manual, why) {
    if (settled) return;
    settled = true; clearTimeout(timer);
    cb(loc, p, manual, why);
  };
  if (!navigator.geolocation) { bail('unsupported'); return; }
  document.getElementById('l1') && (document.getElementById('l1').textContent = '正在获取时间…');
  navigator.geolocation.getCurrentPosition(function (p) {
    var lat = p.coords.latitude, lng = p.coords.longitude, acc = p.coords.accuracy;
    var fmt = Math.abs(lat).toFixed(5) + '°' + (lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(lng).toFixed(5) + '°' + (lng >= 0 ? 'E' : 'W');
    revGeo(lat, lng, function (addr) {
      cb({ lat: lat, lng: lng, acc: acc }, addr ? addr + ' · ' + fmt : fmt, false);
    });
  }, function (err) {
    bail(err && err.code === 1 ? 'denied' : 'unavailable');
  }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
  function askManual(why) {
    return;   // 地点改为员工下拉选择，不再要求手填
    var box = document.getElementById('loc');
    if (!box) return;
    box.innerHTML = '<b>存证信息</b><br>' + why + '，为完成存证请填写当前地点（将打印在协商书上）：' +
      '<input id="mpl" placeholder="例如：Tây Ninh, Gain Lucky Nhà máy" style="margin-top:6px">' +
      '<div class="mini" style="margin-top:4px">签名时间仍会由系统自动记录。</div>';
    var btn = document.getElementById('sub');
    if (btn) {
      btn.disabled = false; btn.textContent = '确认地点并提交签名';
      btn.onclick = function () {
        var v = (document.getElementById('mpl').value || '').trim();
        if (!v) { infoBox('请填写地点', '<p>请在上方填写当前所在地点。</p>'); return; }
        btn.disabled = true;
        onManual(v);
      };
    }
  }
}
function revGeo(lat, lng, cb) {
  var done = false;
  var t = setTimeout(function () { if (!done) { done = true; cb(''); } }, 5000);
  try {
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng + '&accept-language=vi')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (done) return; done = true; clearTimeout(t);
        var a = j && j.address || {};
        cb([a.city || a.town || a.county || a.state, a.country].filter(Boolean).join(', ') || (j && j.name) || '');
      }).catch(function () { if (!done) { done = true; clearTimeout(t); cb(''); } });
  } catch (e) { if (!done) { done = true; clearTimeout(t); cb(''); } }
}
